---
- name: Create topics
  command:
    argv:
      - "{{ kafka_bin_dir }}/kafka-topics.sh"
      - --create
      - --if-not-exists
      - --bootstrap-server
      - "{{ kafka_ip }}:9092"
      - --replication-factor
      - "{{ item.replication_factor }}"
      - --partitions
      - "{{ item.partitions }}"
      - --config
      - "retention.bytes={{ item.retention_bytes }}"
      - --topic
      - "{{ item.name }}"
  loop: "{{ kafka_topics }}"