---
- name: Create topics
  command:
    argv: 
      - "{{ kafkaBinDir }}/kafka-topics.sh"
      - --create 
      - --if-not-exists
      - --bootstrap-server
      - "{{ private_ip | default('127.0.0.1') }}:9092"
      - --replication-factor 
      - "{{ item.replicationFactor }}"
      - --partitions 
      - "{{ item.partitions }}"
      - --config
      - "retention.bytes={{ item.retentionBytes }}"
      - --topic
      - "{{ item.name }}"
  loop: "{{ kafkaTopics }}"