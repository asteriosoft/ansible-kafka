---
- name: Set hostvars
  set_fact:
    kafka_ip: "{{ kafka_ip }}"
    kafka_node_id: "{{ kafka_node_id }}"
  tags: exporter

- name: Create Kafka home directory
  file:
    path: "{{ kafka_home_dir }}"
    state: directory

- name: Getting kafka archive
  get_url:
    url: https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz
    dest: "/tmp/kafka.tgz"
    mode: 0444

- name: Unpacking kafka archive
  unarchive:
    src: "/tmp/kafka.tgz"
    dest: "{{ kafka_home_dir }}"
    extra_opts: [--strip-components=1]
    remote_src: yes
  ignore_errors: "{{ ansible_check_mode }}"

- name: Deleting source archive
  file:
    path: "/tmp/kafka.tgz"
    state: absent

- name: Create Kafka data directory
  file:
    path: "{{ kafka_home_dir }}/data"
    state: directory

- name: Copy kafka server.properties
  template:
    src: "server.properties.j2"
    dest: "{{ kafka_home_dir }}/config/server.properties"
  register: config

- name: Formating kafka data dir for Kraft
  shell: | 
    groups="{{ group_names | join }}"
    if [ ${{ "{" }}{{ "#" }}groups} -lt 15 ]
    then 
      clusterId=`echo $groups{,,,} | base64 | cut -b 1-22`
    else
      clusterId=`echo $groups | base64 | cut -b 1-22`
    fi
    {{ kafka_home_dir }}/bin/kafka-storage.sh format --ignore-formatted -t $clusterId -c {{ kafka_home_dir }}/config/server.properties 
  args:
    executable: /bin/bash

- name: Creating system user
  user:
    name: "{{ kafka_user }}"
    home: "{{ kafka_home_dir }}"

- name: Creating kafka.service script
  template:
    src: "kafka.service.j2"
    dest: "/etc/systemd/system/kafka.service"
    owner: root
    group: root
  register: systemd

- name: Chown for system user
  file:
    dest: "{{ kafka_home_dir }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_user }}"
    recurse: yes

- name: Reload systemd
  systemd:
    daemon_reload: yes
  when: systemd.changed

- name: Restart kafka
  systemd:
    name: kafka
    state: restarted
    enabled: yes
  when: systemd.changed or config.changed
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create topics
  import_tasks:
    file: topics.yml
  tags: topics
  when: kafka_topics is defined

- name: Install kafka exporter
  import_tasks:
    file: exporter.yml
  tags: exporter
  when: kafka_exporter_install
  run_once: true