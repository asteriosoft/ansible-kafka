---
kafka_version: "3.6.0"
kafka_home_dir: "/opt/kafka"
kafka_bin_dir: "{{ kafka_home_dir }}/bin"
kafka_user: "kafka"
kafka_heap_size: 1G
kafka_topics_auto_create: false

# For AWS
#kafka_ip: "{{ private_ip_address }}"
#kafka_node_id: "{{ tags.node_id }}"

# For GCP
#kafka_ip: "{{ private_ip }}"
#kafka_node_id: "{{ labels.node_id }}"

# Default
kafka_ip: "127.0.0.1"
kafka_node_id: "{{ play_hosts.index(inventory_hostname) }}"

## Topics to be created with parameters
# kafka_topics:
#   - name: test
#     replication_factor: 1
#     partitions:  1
#     retention_bytes: 5368709120

kafka_exporter_install: false
kafka_exporter_version: "1.7.0"
kafka_exporter_user: "kafka_exporter"
kafka_exporter_arch: "amd64"
