---
kafkaVersion: "3.6.0"
kafkaHome: "/opt/kafka"
kafkaBinDir: "{{ kafkaHome }}/bin"
kafkaUser: "kafka"
kafkaHeapSize: 1G
autoCreateTopicsEnable: false

# For AWS
#kafkaIpAddress: "{{ private_ip_address }}"

# For GCP
#kafkaIpAddress: "{{ private_ip }}"
#kafkaNodeId: "{{ labels.node_id }}"

# Default
kafkaIpAddress: "127.0.0.1"
kafkaNodeId: "{{ play_hosts.index(inventory_hostname) }}"

## Topics to be created with parameters
# kafkaTopics:
#   - name: test
#     replicationFactor: "{{ '1' if play_hosts | length == 1 else '2' }}"
#     partitions:  1
#     retentionBytes: 5368709120

exporterInstall: false
exporterVersion: "1.7.0"
exporterUser: "kafka_exporter"
exporterArch: "amd64"
